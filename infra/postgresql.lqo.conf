# Cấu hình PostgreSQL 12.5 cho MacBook M1 Pro 16 GB (Docker 10–12 GB).
# Dựa trên lqo_ml_perspective/conf/bao-postgresql.conf và Bảng 2 của bài báo, đã thu nhỏ bộ nhớ.
# Sửa file này rồi chạy `docker compose restart postgres` để áp dụng.

# --- Kết nối ---
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Bộ nhớ (bài báo: shared_buffers 32GB, work_mem 4GB, temp_buffers 32GB, effective_cache_size 32GB) ---
shared_buffers = 3GB
temp_buffers = 256MB
work_mem = 128MB
maintenance_work_mem = 1GB
effective_cache_size = 8GB

# --- Song song (bài báo: max_worker_processes 8) ---
max_worker_processes = 6
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Tối ưu hóa ---
geqo = on                       # Bao chạy với GEQO bật (chú thích Bảng 2); thí nghiệm khác: SET geqo = off
enable_bitmapscan = on
enable_tidscan = on

# --- Giữ thống kê cố định như bài báo ---
autovacuum = off

# --- Extension: pg_hint_plan nạp theo phiên bằng LOAD 'pg_hint_plan' ---
shared_preload_libraries = 'pg_bao'

# --- Khác ---
dynamic_shared_memory_type = posix
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'
